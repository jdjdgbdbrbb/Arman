<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>First bot — Earn Rewards</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
header{background:#111d35;color:white;padding:34px 18px 54px;text-align:center}
.cover{width:min(920px,94%);height:220px;object-fit:cover;border-radius:18px;border:4px solid white;margin:-28px auto 0;display:block;background:#dce5f2}
.profile-wrap{text-align:center;margin-top:-48px;position:relative}
.profile{width:104px;height:104px;object-fit:cover;border-radius:50%;border:5px solid white;background:#dce5f2}
main{max-width:760px;margin:18px auto;padding:0 16px 40px;text-align:center}
.panel{background:white;padding:24px;border-radius:18px;box-shadow:0 8px 28px #17203312}
a.btn{display:inline-block;background:#1687e8;color:white;text-decoration:none;padding:13px 22px;border-radius:12px;font-weight:bold;margin-top:12px}
.note{color:#64748b;font-size:14px;line-height:1.6}
</style>
</head>
<body>
<header>
  <h1>First bot</h1>
  <p>Complete tasks • Collect points • Invite friends</p>
</header>
<!-- Pic2.svg is the cover image. Replace it with your own cover picture if you want. -->
<img class="cover" src="Pic2.svg" alt="First bot cover picture">
<div class="profile-wrap">
  <!-- Pic1.svg is the profile picture. Replace it with your own profile picture if you want. -->
  <img class="profile" src="Pic1.svg" alt="First bot profile picture">
</div>
<main>
  <section class="panel">
    <h2>Welcome to First bot</h2>
    <p>Telegram-এ বটটি খুলে টাস্ক ও রেফারেল ফিচার ব্যবহার করুন।</p>
    <a class="btn" href="https://t.me/" id="botLink">Open Telegram Bot</a>
    <p class="note">নিজের BotFather username দিয়ে নিচের লিংকটি বদলে দিন। উদাহরণ: https://t.me/YourBotUsername</p>
  </section>
</main>
</body>
</html>
